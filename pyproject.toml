[project]
name = "mnist-stub"
version = "0.1.0"
description = "可复现的 MNIST 训练与独立推理测试夹具"
authors = [
    {name = "migo",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.15,<1",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.34,<1",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
]

[project.scripts]
mnist = "mnist_stub.commands.app:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
httpx = ">=0.28,<1"
ruff = ">=0.11,<1"

[tool.poetry]
packages = [{include = "mnist_stub", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
